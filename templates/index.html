{% extends "base.html" %}

{% block content %}

<h1>CRM Overview</h1>
<div style="display:flex; gap:20px; margin:30px 0;">

<div style="background:white; padding:20px; border-radius:8px; min-width:200px;">
<h3>Total Customers</h3>
<p style="font-size:28px; margin:10px 0;">{{ total_customers }}</p>
<a href="{{ url_for('customers') }}" class="btn btn-primary">View</a>
</div>

<div style="background:white; padding:20px; border-radius:8px; min-width:200px;">
<h3>Total Leads</h3>
<p style="font-size:28px; margin:10px 0;">{{ total_leads }}</p>
<a href="{{ url_for('leads') }}" class="btn btn-primary">View</a>
</div>


</div>
<div style="display:flex; gap:20px; margin-bottom:30px;">


</div>

<div style="display:flex; gap:40px; margin-top:30px;">

<div style="width:400px;">
<h3>Customer Status</h3>
<canvas id="customerChart"></canvas>
</div>

<div style="width:400px;">
<h3>Lead Sources</h3>
<canvas id="leadChart"></canvas>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const violetColors = [

"#D8B4FE",
"#C084FC",
"#A855F7",
"#9333EA",
"#E9D5FF"
];

new Chart(document.getElementById("customerChart"), {
type: "pie",
data: {
labels: {{ status_counts.keys() | list | tojson }},
datasets: [{
data: {{ status_counts.values() | list | tojson }},
backgroundColor: violetColors
}]
}
});

new Chart(document.getElementById("leadChart"), {
type: "pie",
data: {
labels: {{ source_counts.keys() | list | tojson }},
datasets: [{
data: {{ source_counts.values() | list | tojson }},
backgroundColor: violetColors
}]
}
});

</script>

{% endblock %}
